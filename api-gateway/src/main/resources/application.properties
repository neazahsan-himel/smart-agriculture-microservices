# ==================== Server ====================
server.port=8080

# ==================== Application ====================
spring.application.name=api-gateway

# ==================== Eureka Client ====================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# ==================== Gateway — Global Settings ====================
# Tag every forwarded request so downstream services know it came through the gateway
spring.cloud.gateway.server.webflux.default-filters[0]=AddRequestHeader=X-Gateway-Source, api-gateway

# HTTP client timeouts
spring.cloud.gateway.server.webflux.httpclient.connect-timeout=5000
spring.cloud.gateway.server.webflux.httpclient.response-timeout=10s

# ==================== Gateway — Routes ====================

# ── farmer-service (/api/v1/farmers/**)
spring.cloud.gateway.server.webflux.routes[0].id=farmer-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://farmer-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/farmers,/api/v1/farmers/**
spring.cloud.gateway.server.webflux.routes[0].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.name=farmer-service
spring.cloud.gateway.server.webflux.routes[0].filters[0].args.fallbackUri=forward:/fallback/farmer-service

# ── crop-service (/api/v1/crops/**)
spring.cloud.gateway.server.webflux.routes[1].id=crop-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://crop-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/crops,/api/v1/crops/**
spring.cloud.gateway.server.webflux.routes[1].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.name=crop-service
spring.cloud.gateway.server.webflux.routes[1].filters[0].args.fallbackUri=forward:/fallback/crop-service

# ── weather-service (/api/v1/weather-records/**)
spring.cloud.gateway.server.webflux.routes[2].id=weather-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://weather-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/weather-records,/api/v1/weather-records/**
spring.cloud.gateway.server.webflux.routes[2].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.name=weather-service
spring.cloud.gateway.server.webflux.routes[2].filters[0].args.fallbackUri=forward:/fallback/weather-service

# ── ai-advisor-service (/api/v1/advisor/**)
spring.cloud.gateway.server.webflux.routes[3].id=ai-advisor-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://ai-advisor-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/advisor,/api/v1/advisor/**
spring.cloud.gateway.server.webflux.routes[3].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.name=ai-advisor-service
spring.cloud.gateway.server.webflux.routes[3].filters[0].args.fallbackUri=forward:/fallback/ai-advisor-service

# ── notification-service (/api/v1/notifications/**)
spring.cloud.gateway.server.webflux.routes[4].id=notification-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/v1/notifications,/api/v1/notifications/**
spring.cloud.gateway.server.webflux.routes[4].filters[0].name=CircuitBreaker
spring.cloud.gateway.server.webflux.routes[4].filters[0].args.name=notification-service
spring.cloud.gateway.server.webflux.routes[4].filters[0].args.fallbackUri=forward:/fallback/notification-service

# ==================== CORS ====================
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allow-credentials=false

# ==================== Circuit Breaker (Resilience4j) ====================
# Shared default config — all 5 service circuit breakers inherit from this
resilience4j.circuitbreaker.configs.default.register-health-indicator=true
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.slow-call-rate-threshold=80
resilience4j.circuitbreaker.configs.default.slow-call-duration-threshold=2000ms

resilience4j.circuitbreaker.instances.farmer-service.base-config=default
resilience4j.circuitbreaker.instances.crop-service.base-config=default
resilience4j.circuitbreaker.instances.weather-service.base-config=default
resilience4j.circuitbreaker.instances.ai-advisor-service.base-config=default
resilience4j.circuitbreaker.instances.notification-service.base-config=default

# ==================== Actuator ====================
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always
management.endpoint.gateway.enabled=true

# ==================== Logging ====================
logging.level.com.smartagriculture=INFO
logging.level.org.springframework.cloud.gateway=INFO